<div class="contenedor">
  @if (noticia(); as item) {
    <article class="articulo">
      <a class="articulo__volver" routerLink="/noticias">← Volver a noticias</a>
      <span class="card__categoria">{{ item.categoria }}</span>
      <h1>{{ item.titulo }}</h1>

      <div class="articulo__meta">
        <span>Por {{ item.autor }}</span>
        <span>·</span>
        <span>{{ item.fecha | fecha }}</span>
      </div>

      @if (item.imagen) {
        <img class="articulo__imagen" [src]="item.imagen" [alt]="item.titulo">
      } @else {
        <div class="articulo__imagen"></div>
      }

      <div class="articulo__acciones">
        <button type="button" class="btn btn--primario" (click)="alternarFavorito(item.id)">
          {{ textoBoton() }}
        </button>
        <a class="btn btn--secundario" routerLink="/contacto">Contactar redacción</a>
      </div>

      <div class="articulo__cuerpo">
        @for (parrafo of item.contenido; track $index) {
          <p class="articulo__parrafo">{{ parrafo }}</p>
        }
      </div>
    </article>
  } @else {
    <section class="seccion">
      <app-estado-vacio
        titulo="No encontramos esta noticia"
        texto="Es posible que haya sido eliminada o que el enlace sea incorrecto."
        enlace="/noticias"
        etiquetaEnlace="Ver todas las noticias" />
    </section>
  }
</div>
